name: Market Signal Monitor

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official signal sources
        shell: bash
        run: |
          set -e
          mkdir -p data/market-signals
          python - <<'PY'
          import hashlib, json, pathlib, urllib.request
          from datetime import datetime, timezone
          sources = [('npc-national-development-plans','https://www.npc.gov.bw/national-development-plans'),('government-business-opportunities','https://gov.bw/doing-business/identified-possible-business-opportunities'),('bitc-investment-areas','https://www.bitc.co.bw/invest/investment-areas/')]
          out=pathlib.Path('data/market-signals')
          for name,url in sources:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Farouk-Market-Signal-Monitor/1.0'})
                  body=urllib.request.urlopen(req,timeout=30).read()
                  digest=hashlib.sha256(body).hexdigest()
                  (out/f'{name}.html').write_bytes(body)
                  (out/f'{name}.json').write_text(json.dumps({'source':url,'retrieved_utc':datetime.now(timezone.utc).isoformat(),'sha256':digest,'status':'FETCHED'},indent=2))
              except Exception as e:
                  (out/f'{name}.json').write_text(json.dumps({'source':url,'status':'ERROR','error':str(e)},indent=2))
          PY
      - name: Commit changed evidence snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market-signals
          git diff --cached --quiet || git commit -m 'chore: refresh market signal evidence'
          git push