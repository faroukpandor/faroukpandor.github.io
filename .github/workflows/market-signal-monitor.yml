name: Market Signal Monitor

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-signal-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The fetch stage used to be an inline Python heredoc in this file: it could
      # not be tested, and it committed whatever it got while the job still went
      # green with every source down. It now lives in scripts/market-signals-fetch.mjs
      # and is covered by tests/market-signals-fetch.test.mjs.
      - name: Fetch official signal sources
        run: node scripts/market-signals-fetch.mjs fetch

      - name: Report signal health
        if: always()
        run: |
          node scripts/market-signals-fetch.mjs health | tee -a "$GITHUB_STEP_SUMMARY"

      # A run where every source failed must not look successful. Individual
      # outages stay visible in the digest without blocking unrelated work.
      - name: Fail if no source could be fetched
        run: node scripts/market-signals-fetch.mjs require-health

      - name: Normalise & deduplicate market signal digest
        run: node scripts/market-signals.mjs process

      - name: Verify digest integrity
        run: node scripts/market-signals.mjs verify

      - name: Commit changed evidence snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market-signals
          git diff --cached --quiet || git commit -m 'chore: refresh market signal evidence'
          git push
